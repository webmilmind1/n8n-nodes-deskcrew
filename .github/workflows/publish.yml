name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token npm exchanges for both publish auth and provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 20 ships npm 10, which predates trusted publishing. Without this the
      # publish fails with an auth error that never mentions the npm version.
      - run: npm install -g npm@latest

      - run: npm ci || npm install

      - run: npm run build --if-present
      - run: npm test --if-present

      - run: npm publish --provenance --access public
