# Publish to npm with provenance.
#
# n8n's Creator Portal refuses packages published without provenance. Provenance is
# a signed attestation linking the tarball to the exact repo, workflow and commit
# that produced it, and npm only issues one for a publish inside a public CI run it
# can verify. Publishing from a laptop can never satisfy it, whatever flags you pass.
#
# Needs one repository secret: NPM_TOKEN, an npm Automation token.
# Actions minutes are free and unlimited on public repos, so this costs nothing.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The whole point: lets the job mint the OIDC token npm exchanges for a
      # provenance attestation. Without it the publish still succeeds but produces
      # no provenance, and n8n rejects it exactly as before.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Provenance needs npm >= 9.5.0; Node 20 ships new enough.
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci || npm install

      # n8n auto-rejects a node that fails its starter checks, so fail here rather
      # than in their review queue.
      - run: npm run build --if-present
      - run: npm test --if-present

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
